version: '3.6'
services:
  plumber:
    build: .
    image: ${CCAO_REGISTRY_URL}/api-res-avm:latest
    ports:
      - "${API_PORT}:${API_PORT}"
    networks:
      - api-res-avm-net
    env_file: .env
    secrets:
      - ENV_FILE
    restart: unless-stopped
    # Ship the app's stdout/stderr to CloudWatch. Note that the Docker daemon,
    # not the container, needs AWS credentials that can write to the log
    # group; see the README for details
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /ccao/services/api-res-avm
        awslogs-stream: plumber

networks:
  api-res-avm-net:
    ipam:
      config:
        - subnet: 211.25.0.0/16
    name: api-res-avm-net

secrets:
  ENV_FILE:
    file: secrets/ENV_FILE
