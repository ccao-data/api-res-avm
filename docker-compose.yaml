version: '3.6'

x-default: &plumber
  build: .
  image: ${CCAO_REGISTRY_URL}/api-res-avm:latest
  ports:
    - "${API_PORT}:${API_PORT}"
  networks:
    - api-res-avm-net
  env_file: .env
  secrets:
    - ENV_FILE

services:
  # Logs only print to the console
  plumber-dev:
    <<: *plumber
    profiles: ["", "dev"]
    container_name: plumber-dev
    restart: no

  plumber-prod:
    <<: *plumber
    profiles: [prod]
    container_name: plumber-prod
    restart: unless-stopped
    # Logs print to the console and the app also uploads them to CloudWatch
    environment:
      CLOUDWATCH_LOG_GROUP_NAME: /ccao/services/api-res-avm

networks:
  api-res-avm-net:
    ipam:
      config:
        - subnet: 211.25.0.0/16
    name: api-res-avm-net

secrets:
  ENV_FILE:
    file: secrets/ENV_FILE
